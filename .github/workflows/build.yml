name: Build NeoForge mod

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch Warden AV source assets
        run: |
          mkdir -p build/model src/main/resources/assets/maxtac_development
          curl -fL "https://raw.githubusercontent.com/exiledmajor/Reference-2/main/The%20Modpack/Modelling%201/warden_av_v11_pack/warden_av_v11.bbmodel" -o build/model/warden_av_v11.bbmodel
          curl -fL "https://raw.githubusercontent.com/exiledmajor/Reference-2/main/The%20Modpack/Modelling%201/warden_av_v11_pack/warden_v11_texture.png" -o build/model/warden_v11_texture.png
          python tools/convert_bbmodel.py build/model/warden_av_v11.bbmodel -o src/main/resources/assets/maxtac_development/warden_av_v11.mesh.json
          cp build/model/warden_v11_texture.png src/main/resources/assets/maxtac_development/warden_v11_texture.png
      - name: Build
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: maxtac-development-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
